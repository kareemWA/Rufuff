<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سلة كتبك وإتمام الشراء">
    <link rel="stylesheet" href="assets/css/style.css">

<body class="cart-page">
    <header class="header cart-header">
        <a href="index.html" class="site-brand" aria-label="رفوف، مكتبة إلكترونية"><img src="icon/icn.png" alt="شعار رفوف"><span>رفوف</span></a>

    <main class="cart-main">
        <div class="cart-heading">
            <div>
                <span class="book-category">مراجعة الطلب</span>

                <p>راجع اختياراتك ثم أتمم الشراء عندما تكون جاهزًا.</p>

            <aside class="cart-checkout">

                <button id="checkoutButton" class="btn" type="button">إتمام الشراء</button>
