<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon/icn.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
     <style>
        /* الصفحة */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* الوضع الليلي */
body.dark-mode{
    background:#2b2a2a;
}

/* الكارد */
.login-box{
    width:380px;
    max-width:90%;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
    text-align:center;
}

body.dark-mode .login-box{
    background:#242424;
}

/* اللوجو */
.login-box img{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-bottom:15px;
}

.login-box h2{
    margin-bottom:8px;
    color:#007bff;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

body.dark-mode .login-box p{
    color:#ddd;
}

/* الحقول */
.login-box input{
    width:100%;
    height:48px;
    margin-bottom:18px;
    padding:0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;
    box-sizing:border-box;
}

body.dark-mode .login-box input{
    background:#333;
    border:1px solid #444;
    color:white;
}

.login-box input:focus{
    border-color:#007bff;
    box-shadow:0 0 8px rgba(0,123,255,.25);
}

/* الزر */
.login-box button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#007bff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#0056b3;
    transform:translateY(-2px);
}

/* الروابط */
.login-box a{
    color:#007bff;
    text-decoration:none;
    font-size:14px;
}

.login-box a:hover{
    text-decoration:underline;
}

.login-footer{
    margin-top:20px;
}

/* الموبايل */
@media(max-width:768px){

    .login-box{
        width:92%;
        padding:25px;
    }

    .login-box h2{
        font-size:24px;
    }

    .login-box input,
    .login-box button{
        height:46px;
    }

}
    </style>
</head>
<body class="auth-page">
 <div class="login-box">

    <img src="icon/icn.png" alt="شعار رفوف">

    <h2>.مرحباً بعودتك في رفوف</h2>

    <p>سجل الدخول إلى حسابك</p>

    <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="رقم الهاتف (11 رقمًا)">

    <input id="password" type="password" placeholder="كلمة المرور">

    <button onclick="login()">تسجيل الدخول</button>
    <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>

    <div class="login-footer">
        ليس لديك حساب؟
        <a href="signin.html">إنشاء حساب</a>
    </div>

</div>
<footer class="site-footer">
    <p>برمجة وتطوير <strong>كريم جيره</strong></p>
    <div><a href="tel:01016355675">01016355675</a><a href="mailto:kareemgera1@gmail.com">kareemgera1@gmail.com</a></div>
</footer>
<script>
async function login() {

    const phone = document.getElementById("phone").value.replace(/\D/g, "");
    const pass = document.getElementById("password").value;
    const message = document.getElementById("formMessage");

    if (!/^\d{11}$/.test(phone) || !pass.trim()) {
        message.textContent = "اكتب رقم هاتف صحيحًا من 11 رقمًا وكلمة المرور.";
        message.className = "form-message error";
        return;
    }

    message.textContent = "جارٍ تسجيل الدخول...";
    message.className = "form-message";

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pass })
        });
        if (!response.ok) throw new Error(await response.text());

        const user = await response.json();
        localStorage.setItem("currentUser", JSON.stringify(user));
        message.textContent = "تم تسجيل الدخول بنجاح...";
        message.className = "form-message success";
        const requestedReturn = new URLSearchParams(window.location.search).get("return");
        const returnUrl = requestedReturn && requestedReturn.startsWith("/") && !requestedReturn.startsWith("//") ? requestedReturn : "index.html";
        setTimeout(() => { window.location.href = returnUrl; }, 500);
    } catch (error) {
        message.textContent = error.message || "تعذر تسجيل الدخول.";
        message.className = "form-message error";
    }
}
</script>
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/sidebar-fix.css?v=1">
<script src="assets/js/library.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
