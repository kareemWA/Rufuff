<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="قارئ الكتب الرقمية من رفوف">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/sidebar-fix.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <title>قارئ الكتاب | رفوف</title>
</head>
<body class="reader-page">
    <header class="header reader-header">
        <a href="index.html" class="site-brand" aria-label="رفوف، مكتبة إلكترونية"><img src="icon/icn.png" alt="شعار رفوف"><span>رفوف</span></a>
        <div class="page-actions">
            <a href="purchased.html" class="detail-back">مكتبتي</a>
            <a href="index.html" class="detail-back">الكتب</a>
        </div>                                          
    </header>
    <main class="reader-main">
        <div class="reader-heading">
            <div>
                <span class="book-category">قارئ رفوف</span>
                <h1 id="readerTitle">جارٍ تحميل الكتاب...</h1>
                <p id="readerAuthor"></p>
            </div>
            <a id="readerDownload" class="download-link" href="#" target="_blank" rel="noopener" hidden>تحميل PDF</a>
        </div>
        <p id="readerStatus" class="detail-status">جارٍ تجهيز الكتاب...</p>
        <div id="readerControls" class="reader-controls" hidden>
            <button type="button" id="prevPageBtn" aria-label="الصفحة السابقة">السابق</button>
            <span id="pageIndicator">0 / 0</span>
            <button type="button" id="nextPageBtn" aria-label="الصفحة التالية">التالي</button>
            <button type="button" id="zoomOutBtn" aria-label="تصغير">-</button>
            <button type="button" id="zoomInBtn" aria-label="تكبير">+</button>
        </div>
        <div id="readerFrameWrap" class="reader-frame-wrap" hidden>
            <iframe id="readerFrame" title="عرض الملف PDF" allow="fullscreen" loading="lazy"></iframe>
        </div>
    </main>
    <footer class="site-footer">
        <p>برمجة وتطوير <strong><a href="https://www.instagram.com/_kareem_gera/">كـريم جـيره</a></strong></p>
        <div><a href="mailto:kareemgera1@gmail.com">بريد الالكتروني</a></div>
    </footer>
    <style>
        .reader-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            flex-wrap: wrap;
            margin: 1rem auto 1.5rem;
            padding: 0.7rem 0.8rem;
            background: rgba(49, 94, 80, 0.06);
            border: 1px solid rgba(49, 94, 80, 0.12);
            border-radius: 16px;
            max-width: 480px;
            box-shadow: 0 6px 14px rgba(49, 94, 80, 0.08);
        }
        .reader-controls button {
            border: 0;
            background: var(--primary, #315e50);
            color: #fff;
            border-radius: 999px;
            padding: 0.5rem 0.8rem;
            min-width: 2.8rem;
            cursor: pointer;
            font: 600 0.85rem/1 "Cairo", sans-serif;
            transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 6px 12px rgba(49, 94, 80, 0.16);
        }
        .reader-controls button:hover {
            background: var(--primary-dark, #24493e);
            transform: translateY(-1px);
        }
        .reader-controls button:active {
            transform: translateY(0);
        }
        .reader-controls button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pageIndicator {
            min-width: 7.2rem;
            text-align: center;
            font-size: 0.82rem;
            color: var(--primary, #315e50);
            font-weight: 700;
            padding: 0.42rem 0.7rem;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            border: 1px solid rgba(49, 94, 80, 0.08);
        }
        .reader-frame-wrap {
            overflow: hidden;
            background: #f4f1ec;
            border: 1px solid rgba(27, 61, 95, 0.12);
            border-radius: 18px;
            padding: 0.5rem;
            min-height: 70vh;
        }
        #readerFrame {
            display: block;
            width: 100%;
            min-height: 70vh;
            border: 0;
            background: #fff;
            border-radius: 12px;
        }

        @media (max-width: 576px) {
            .reader-main {
                padding-inline: 0.75rem;
            }
            .reader-heading {
                gap: 0.75rem;
                align-items: flex-start;
            }
            .reader-controls {
                gap: 0.45rem;
                padding: 0.55rem 0.65rem;
                max-width: 100%;
            }
            .reader-controls button {
                padding: 0.45rem 0.7rem;
                min-width: 2.4rem;
                font-size: 0.8rem;
            }
            #pageIndicator {
                min-width: 6.5rem;
                font-size: 0.78rem;
                padding: 0.35rem 0.55rem;
            }
            .reader-frame-wrap {
                min-height: 58vh;
                padding: 0.35rem;
            }
            #readerFrame {
                min-height: 58vh;
            }
        }
    </style>
    <script src="assets/js/reader.js?v=7"></script>
</body>
</html>
