<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سلة كتبك وإتمام الشراء">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/sidebar-fix.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <title>السلة | رفوف</title>
</head>
<body class="cart-page">
    <header class="header cart-header">
        <a href="index.html" class="site-brand" aria-label="رفوف، مكتبة إلكترونية"><img src="icon/icn.png" alt="شعار رفوف"><span>رفوف</span></a>
        <div class="page-actions">
            <a href="purchased.html" class="detail-back">كتبي المشتراة</a>
            <a href="index.html" class="detail-back">متابعة تصفح الكتب</a>
        </div>
    </header>

    <main class="cart-main">
        <div class="cart-heading">
            <div>
                <span class="book-category">مراجعة الطلب</span>
                <h1>سلة كتبك</h1>
                <p>راجع اختياراتك ثم أتمم الشراء عندما تكون جاهزًا.</p>
            </div>
            <span id="cartSummary" class="cart-summary"></span>
        </div>

        <div class="cart-layout">
            <section id="cartItems" class="cart-items" aria-live="polite"></section>
            <aside class="cart-checkout">
                <span class="book-category">الإجمالي</span>
                <strong id="cartTotal" class="cart-total">0 جنيه</strong>
                <button id="checkoutButton" class="btn" type="button">إتمام الشراء</button>
                <label for="couponCode">كود الخصم</label>
                <div class="coupon-row">
                    <input id="couponCode" type="text" placeholder="أدخل الكوبون إن وجد" autocomplete="off">
                    <button id="applyCoupon" class="coupon-button" type="button">تطبيق</button>
                </div>
                <span id="couponStatus" class="coupon-status" role="status" aria-live="polite"></span>
                <p id="cartMessage" class="form-message" role="status" aria-live="polite"></p>
            </aside>
        </div>
        <section id="manualPaymentPanel" class="manual-payment-panel" hidden>
            <span class="book-category">الدفع الإلكتروني عبر Kashier</span>
            <h2>أكمل الدفع بأمان</h2>
            <p>سيتم تحويلك إلى بوابة Kashier لدفع مبلغ <strong id="paymentAmount">0 جنيه</strong> باستخدام البطاقة أو المحفظة.</p>
            <button id="submitPayment" class="btn" type="button">الانتقال إلى Kashier</button>
            <p id="paymentMessage" class="form-message" role="status" aria-live="polite"></p>
        </section>
    </main>
<footer class="site-footer">
    <p>برمجة وتطوير <strong><a href="https://www.instagram.com/_kareem_gera/" target="_blank" rel="noopener noreferrer">كـريم جـيره</a></strong></p>
    <div><a href="mailto:kareemgera1@gmail.com">بريد الالكتروني</a></div>
</footer>
    <script src="assets/js/library.js"></script>
    <script src="assets/js/cart.js"></script>
</body>
</html>
