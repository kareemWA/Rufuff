<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon/icn.png">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/sidebar-fix.css?v=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>
    <style>
        /* الصفحة */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* الوضع الليلي */
body.dark-mode{
    background:#2b2a2a;
}

/* الكارد */
.login-box{
    width:380px;
    max-width:90%;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
    text-align:center;
}

body.dark-mode .login-box{
    background:#242424;
}

/* اللوجو */
.login-box img{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-bottom:15px;
}

.login-box h2{
    margin-bottom:8px;
    color:#007bff;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

body.dark-mode .login-box p{
    color:#ddd;
}

/* الحقول */
.login-box input{
    width:100%;
    height:48px;
    margin-bottom:18px;
    padding:0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;
    box-sizing:border-box;
}

body.dark-mode .login-box input{
    background:#333;
    border:1px solid #444;
    color:white;
}

.login-box input:focus{
    border-color:#007bff;
    box-shadow:0 0 8px rgba(0,123,255,.25);
}

/* الزر */
.login-box button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#007bff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#0056b3;
    transform:translateY(-2px);
}

/* الروابط */
.login-box a{
    color:#007bff;
    text-decoration:none;
    font-size:14px;
}

.login-box a:hover{
    text-decoration:underline;
}

.login-footer{
    margin-top:20px;
}

/* الموبايل */
@media(max-width:768px){

    .login-box{
        width:92%;
        padding:25px;
    }

    .login-box h2{
        font-size:24px;
    }

    .login-box input,
    .login-box button{
        height:46px;
    }

}
    </style>
</head>
<body class="auth-page">
<div class="login-box">

    <img src="icon/icn.png" alt="شعار رفوف">

    <h2>.مرحباً بك في رفوف</h2>

    <p>انشئ حساب مجاني</p>
    <input id="name" type="text" placeholder="اسم المستخدم"> 
    <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="رقم الهاتف (11 رقمًا)">

    <input id="password" type="password" placeholder="كلمة المرور">

    <button id="signupButton" onclick="signup()">إنشاء الحساب</button>
    <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>

    <div class="login-footer">
         لديك حساب؟ 
        <a href="logIn.html">تسجيل الدخول</a>
    </div>

</div>
<footer class="site-footer">
        <p>برمجة وتطوير <strong><a href="https://www.instagram.com/_kareem_gera/">كـريم جـيره</a></strong></p>
        <div><a href="mailto:kareemgera1@gmail.com">بريد الالكتروني</a></div>
</footer>
<script>
async function signup (){
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value.replace(/\D/g, "");
    const pass = document.getElementById("password").value;
    const message = document.getElementById("formMessage");
    const button = document.getElementById("signupButton");

    if (!name.trim() || !/^\d{11}$/.test(phone) || !pass.trim()) {
        message.textContent = "اكتب الاسم ورقم هاتف صحيحًا من 11 رقمًا وكلمة المرور.";
        message.className = "form-message error";
        return;
    }

    button.disabled = true;
    message.textContent = "جارٍ إنشاء الحساب...";
    message.className = "form-message";

    try {
        const response = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone, pass })
        });
        const data = response.ok ? await response.json() : await response.text();
        if (!response.ok) throw new Error(data);

        localStorage.setItem("currentUser", JSON.stringify(data));
        message.textContent = "تم إنشاء الحساب. سيتم نقلك إلى الصفحة الرئيسية...";
        message.className = "form-message success";
        setTimeout(() => { window.location.href = "index.html"; }, 500);
    } catch (error) {
        message.textContent = error.message || "تعذر إنشاء الحساب.";
        message.className = "form-message error";
        button.disabled = false;
    }
}

</script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/library.js"></script>
<script src="assets/js/script.js"></script>

</body>

</html>
