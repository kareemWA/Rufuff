<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفوف | دردشة</title>
    <link rel="icon" type="image/png" href="icon/icn.png">
    <link rel="stylesheet" href="assets/css/style.css?v=4">
    <link rel="stylesheet" href="assets/css/sidebar-fix.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="brand">
            <a href="index.html" class="site-brand" aria-label="رفوف"><img src="icon/icn.png" alt="شعار رفوف"><span>رفوف</span></a>
            <button class="btn-open-list" id="menuBtn" type="button" aria-label="فتح القائمة"><span class="menu-icon" aria-hidden="true"></span></button>
        </div>
        <a href="sitting.html" class="acc"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTH4qo2FqKLWRvoIFuXfE_reXlHh2I_DMpeWQ&s" id="photo" alt="صورة الحساب"><h3 id="naMe">حسابي</h3></a>
    </header>

    <aside class="sidebar-drawer" aria-label="القائمة الجانبية">
        <section class="list nav">
            <a href="index.html">⌂&nbsp; الرئيسية</a>
            <a href="index.html#books">▦&nbsp; كل المحتوى</a>
            <a href="chat.html" class="is-current" aria-current="page">💬&nbsp; دردشة</a>
            <a href="favorites.html">♡&nbsp; المفضلة</a>
        </section>
        <section class="list_bottom nav_bottom">
            <a href="sitting.html">⚙&nbsp; الإعدادات</a>
            <a href="purchased.html">▤&nbsp; كتبي المشتراة</a>
            <a id="logout" href="#">تسجيل الدخول</a>
        </section>
    </aside>

    <main class="chat-main">
        <section class="chat-hero" id="chatHero">
            <h1>دردشة رفوف</h1>
            <p>اختر مساحتك: تحدث مع مؤسس رفوف بشكل خاص أو شارك المجتمع أفكارك.</p>
        </section>
        <section class="chat-shell">
            <div class="chat-cards" role="tablist" aria-label="غرف الدردشة">
                <button class="chat-card active" type="button" data-room="founder" role="tab" aria-selected="true">
                    <img src="icon/f.jpg" alt="صورة مؤسس رفوف">
                    <span class="chat-card-content">
                        <strong>دردشة خاصة مع مؤسس رفوف</strong>
                        <small>رسالتك تصل إلى المؤسس فقط</small>
                    </span>
                    <span class="premium-badge">Premium</span>
                </button>
                <button class="chat-card" type="button" data-room="public" role="tab" aria-selected="false">
                    <span class="community-icon" aria-hidden="true"><img src="icon/c.jpg" alt="صورة المجتمع"></span>
                    <span class="chat-card-content">
                        <strong>دردشة المجتمع</strong>
                        <small>شارك أفكارك مع أعضاء رفوف</small>
                    </span>
                </button>
            </div>
            <div class="chat-content">
                <section class="founder-inbox" id="founderInbox" hidden>
                    <div class="founder-inbox-heading">
                        <h2>رسائل الأعضاء</h2>
                        <span>اختر محادثة للرد</span>
                    </div>
                    <div class="conversation-list" id="conversationList"></div>
                </section>
                <p class="chat-note" id="chatNote">كل أعضاء رفوف المسجلين يستطيعون رؤية رسائل هذه الغرفة.</p>
                <div class="chat-messages" id="chatMessages" aria-live="polite"><p class="no">جارٍ تحميل الرسائل...</p></div>
                <form class="chat-form" id="chatForm" action="javascript:void(0)">
                    <textarea id="chatText" maxlength="1000" placeholder="اكتب رسالتك..." required></textarea>
                    <button class="btn" type="submit">إرسال الرسالة</button>
                </form>
                <p class="form-message" id="chatStatus" role="status" aria-live="polite"></p>
            </div>
        </section>
    </main>
    <script src="assets/js/chat.js?v=4"></script>
</body>
</html>
